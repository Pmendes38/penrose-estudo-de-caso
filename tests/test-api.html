<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste da API</title>
</head>
<body>
    <h1>Teste da API Backend</h1>
    <p><strong>Status:</strong> <span id="status">Aguardando...</span></p>
    <button onclick="testAPI()">Testar API</button>
    <button onclick="testLogin()">Testar Login Admin</button>
    <button onclick="testLoginCliente()">Testar Login Cliente</button>
    <div id="result"></div>

    <script>
        // Função para testar se o proxy está funcionando
        async function testAPI() {
            try {
                document.getElementById('status').textContent = 'Testando...';
                // Usar o proxy do Vite em vez de acessar diretamente
                const response = await fetch('/api/test');
                const data = await response.json();
                document.getElementById('result').innerHTML = `<p style="color: green;">✅ API funcionando: ${JSON.stringify(data)}</p>`;
                document.getElementById('status').textContent = 'API funcionando!';
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">❌ Erro na API: ${error.message}</p>`;
                document.getElementById('status').textContent = 'Erro na API';
            }
        }

        async function testLogin() {
            try {
                document.getElementById('status').textContent = 'Testando login admin...';
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'contato@example.com',
                        password: '123456'
                    })
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = `<p style="color: green;">✅ Login Admin funcionando: ${JSON.stringify(data)}</p>`;
                document.getElementById('status').textContent = 'Login admin funcionando!';
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">❌ Erro no login admin: ${error.message}</p>`;
                document.getElementById('status').textContent = 'Erro no login admin';
            }
        }

        async function testLoginCliente() {
            try {
                document.getElementById('status').textContent = 'Testando login cliente...';
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: 'contato@example.com',
                        password: '123456'
                    })
                });
                const data = await response.json();
                document.getElementById('result').innerHTML = `<p style="color: blue;">🔍 Login Cliente: ${JSON.stringify(data)}</p>`;
                document.getElementById('status').textContent = 'Login cliente testado';
            } catch (error) {
                document.getElementById('result').innerHTML = `<p style="color: red;">❌ Erro no login cliente: ${error.message}</p>`;
                document.getElementById('status').textContent = 'Erro no login cliente';
            }
        }

        // Testar automaticamente ao carregar a página
        window.onload = function() {
            document.getElementById('status').textContent = 'Página carregada - Clique em "Testar API"';
        };
    </script>
</body>
</html>
