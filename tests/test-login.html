<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Login API</title>
</head>
<body>
    <h1>Teste da API de Login</h1>
    
    <form id="loginForm">
        <div>
            <label for="email">Email:</label>
            <input type="email" id="email" value="contato@example.com" required>
        </div>
        <div>
            <label for="password">Senha:</label>
            <input type="password" id="password" value="123456" required>
        </div>
        <button type="submit">Fazer Login</button>
    </form>
    
    <div id="result"></div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            
            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.text();
                console.log('Status:', response.status);
                console.log('Resposta:', data);
                
                resultDiv.innerHTML = `
                    <h3>Status: ${response.status}</h3>
                    <pre>${data}</pre>
                `;
                
            } catch (error) {
                resultDiv.innerHTML = `<p style="color: red;">Erro: ${error.message}</p>`;
                console.error('Erro:', error);
            }
        });
    </script>
</body>
</html>
